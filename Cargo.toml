[package]
name = "vm-test-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "net"] }
tokio-vsock = "0.7.2"
zerocopy = { version = "0.8.56", features = ["derive"] }
